query LoadPartyContext($partyId: ID!) {
  party(id: $partyId) {
    id
    displayName
    features
    limitations {
      quota {
        uploadSizeLimit
      }
      jobs {
        cacheCount
        workspaceAvailableHours
      }
      dataset {
        publicItem {
          current
          limit
        }
        privateItem {
          current
          limit
        }
      }
      project {
        publicItem {
          current
          limit
        }
        privateItem {
          current
          limit
        }
      }
      resources {
        key
        value {
          current
          limit
          freeCount
        }
      }
      gpus {
        key
        value {
          current
          limit
        }
      }
      unfinishedSnapshots {
        current
        limit
      }
    }
    ... on User {
      username
    }
    ... on Org {
      description
      locked
    }
  }
}
