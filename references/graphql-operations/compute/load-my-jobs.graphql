query LoadMyJobs(
  $username: ID!
  $page: Int! = 1
  $status: [JobStatusInput] = [ALL]
  $q: String! = ""
  $modes: [JobModeInput!] = [WORKSPACE, TASK]
) {
  party(id: $username) {
    id
    jobs(page: $page, status: $status, q: $q, modes: $modes) {
      data {
        __typename
        id
        name
        description
        mode
        status
        subStatus
        createdAt
        startedAt
        endAt
        resource {
          name
          verboseName
          gpuResource
          memory
        }
        runtime {
          framework
          version
          device
        }
        project {
          id
          name
        }
        links {
          name
          value
        }
      }
      pageInfo {
        current
        total
        next
        prev
      }
    }
  }
}
