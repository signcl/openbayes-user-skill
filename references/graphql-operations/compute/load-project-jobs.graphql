query LoadProjectJobs(
  $projectId: String!
  $userId: String!
  $page: Int! = 1
  $perPage: Int! = 30
  $status: [JobStatusInput!] = [ALL]
  $mode: JobModeInput = ALL
  $labelKeys: [String!]
) {
  project(projectId: $projectId) {
    id
    name
    jobs(
      userId: $userId
      projectId: $projectId
      page: $page
      perPage: $perPage
      status: $status
      mode: $mode
      labelKeys: $labelKeys
    ) {
      data {
        __typename
        id
        name
        mode
        status
        subStatus
        createdAt
        startedAt
        endAt
        resource {
          name
          verboseName
        }
        runtime {
          framework
          version
          device
        }
        links {
          name
          value
        }
      }
      pageInfo {
        current
        total
        next
        prev
      }
    }
  }
}
