query DatasetSearchOwned(
  $username: ID!
  $q: String! = ""
  $page: Int! = 1
  $category: [DatasetCategoryInput] = [ALL]
) {
  party(id: $username) {
    id
    datasets(q: $q, page: $page, category: $category) {
      data {
        id
        name
        category
        latestVersion
        size
        permissions {
          publicPermission
          orgPermission
        }
        latestDatasetVersion {
          id
          version
          semanticBindingName
          canBindJob
          canBeBoundWithWritePermission
        }
        tags {
          name
        }
        links {
          name
          value
        }
      }
      pageInfo {
        current
        total
        next
        prev
      }
    }
  }
}
