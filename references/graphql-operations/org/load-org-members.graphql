query LoadOrgMembers(
  $orgId: String!
  $page: Int! = 1
  $perPage: Int! = 30
) {
  orgMembers(orgId: $orgId, page: $page, perPage: $perPage) {
    data {
      id
      role
      email
      createdAt
      expiredAt
      canRemove
      canChangeRole
      user {
        id
        username
        displayName
      }
    }
    pageInfo {
      current
      total
      next
      prev
    }
  }
}
