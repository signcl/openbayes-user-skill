query LoadUserContext($username: String!) {
  user(username: $username) {
    id
    username
    displayName
    features
    limitations {
      quota {
        uploadSizeLimit
      }
      jobs {
        cacheCount
        workspaceAvailableHours
      }
      dataset {
        publicItem {
          current
          limit
        }
        privateItem {
          current
          limit
        }
      }
      project {
        publicItem {
          current
          limit
        }
        privateItem {
          current
          limit
        }
      }
      resources {
        key
        value {
          current
          limit
          freeCount
        }
      }
      gpus {
        key
        value {
          current
          limit
        }
      }
      unfinishedSnapshots {
        current
        limit
      }
    }
  }
}
